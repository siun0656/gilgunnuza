let ts;const cv=$('cv');
cv.addEventListener('touchstart',e=>{e.preventDefault();ts=e.touches[0]},{passive:false});
cv.addEventListener('touchend',e=>{e.preventDefault();if(!ts)return;const t=e.changedTouches[0],dx=t.clientX-ts.clientX,dy=t.clientY-ts.clientY;
 if(Math.max(Math.abs(dx),Math.abs(dy))<25)mv(1,0);else if(Math.abs(dx)>Math.abs(dy))mv(0,dx>0?1:-1);else mv(dy<0?1:-1,0)},{passive:false});
start();
requestAnimationFrame(loop);
